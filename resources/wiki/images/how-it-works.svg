<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #ddf4ff; stroke: #54aeff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #59636e; font-size: 12.5px; }
    .code { fill: #0969da; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .arrow { stroke: #8c959f; stroke-width: 1.6; fill: none; }
    .head { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #0c2d4b; stroke: #1f6feb; }
      .title { fill: #e6edf3; }
      .text { fill: #9198a1; }
      .code { fill: #4493f8; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="300" rx="12"/>

  <!-- the streams -->
  <rect class="box" x="24" y="24" width="170" height="70" rx="10" stroke-width="1.2"/>
  <text class="code" x="44" y="52">wav.Decode</text>
  <text class="text" x="44" y="74">a WAV file, any depth</text>
  <rect class="box" x="24" y="115" width="170" height="70" rx="10" stroke-width="1.2"/>
  <text class="code" x="44" y="143">vorbis.Decode</text>
  <text class="text" x="44" y="165">an Ogg Vorbis file</text>
  <rect class="box" x="24" y="206" width="170" height="70" rx="10" stroke-width="1.2"/>
  <text class="code" x="44" y="234">sound.Tone</text>
  <text class="text" x="44" y="256">or a stream of your own</text>

  <path class="arrow" d="M194,59 C230,59 230,135 262,135" marker-end="url(#arrow)"/>
  <path class="arrow" d="M194,150 H262" marker-end="url(#arrow)"/>
  <path class="arrow" d="M194,241 C230,241 230,165 262,165" marker-end="url(#arrow)"/>

  <!-- the players -->
  <rect class="accent" x="266" y="70" width="270" height="160" rx="10" stroke-width="1.4"/>
  <text class="code" x="401" y="98" text-anchor="middle">Context.NewPlayer</text>
  <text class="title" x="401" y="122" text-anchor="middle">A player per sound</text>
  <text class="text" x="401" y="146" text-anchor="middle">to stereo at the context's rate,</text>
  <text class="text" x="401" y="163" text-anchor="middle">as it is read</text>
  <text class="text" x="401" y="187" text-anchor="middle">play, pause, loop, volume,</text>
  <text class="text" x="401" y="204" text-anchor="middle">the position heard now</text>

  <!-- the output -->
  <path class="arrow" d="M536,150 H588" marker-end="url(#arrow)"/>
  <rect class="box" x="592" y="60" width="264" height="180" rx="10" stroke-width="1.2"/>
  <text class="code" x="612" y="88">oto</text>
  <text class="title" x="612" y="112">Mixed, to the speakers</text>
  <text class="text" x="612" y="138">Android: AAudio or OpenSL ES</text>
  <text class="text" x="612" y="158">Linux: PulseAudio or ALSA</text>
  <text class="text" x="612" y="178">macOS: AudioToolbox</text>
  <text class="text" x="612" y="198">Windows: WASAPI</text>
  <text class="text" x="612" y="218">a web page: an AudioWorklet</text>
</svg>
